name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    name: Lint & Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: Python Syntax & Lint Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,batch_test_docs

      - name: Validate Kubernetes Manifests
        run: |
          python -c "
          import glob, yaml
          for f in sorted(glob.glob('k8s/*.yaml')):
              with open(f) as stream:
                  list(yaml.safe_load_all(stream))
                  print(f'[✓] Valid YAML: {f}')
          "

  docker-build-check:
    name: Build Microservice Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ingestion Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/ingestion
          push: false
          tags: local-rag/ingestion:test

      - name: Build Worker Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/worker
          push: false
          tags: local-rag/worker:test

      - name: Build Retrieval Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/retrieval
          push: false
          tags: local-rag/retrieval:test
