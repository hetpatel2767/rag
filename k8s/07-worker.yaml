apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser-worker
  namespace: local-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parser-worker
  template:
    metadata:
      labels:
        app: parser-worker
    spec:
      containers:
        - name: parser-worker
          image: local-rag/worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "redpanda.local-rag.svc.cluster.local:9092"
            - name: TOPIC_REALTIME
              value: "doc-ingest-realtime"
            - name: TOPIC_BULK
              value: "doc-ingest-bulk"
            - name: TOPIC_DLQ
              value: "doc-ingest-dlq"
            - name: CONSUMER_GROUP
              value: "rag-parser-group"
            - name: MINIO_ENDPOINT
              value: "minio:9000"
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "minioadmin"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017"
            - name: QDRANT_HOST
              value: "qdrant"
            - name: QDRANT_PORT
              value: "6333"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
